<svg width="680" height="780" viewBox="0 0 680 780" role="img" xmlns="http://www.w3.org/2000/svg">
<title>AMRA logo — Anti-Microbial Research Association, The University of Burdwan</title>
<desc>Circular seal in navy and gold. Centre shows a protein alpha-helix interacting with a DNA double helix and a small ligand molecule. The university crest (lamp on open book) sits at top. Outer ring carries the association name and university name. Motto in Sanskrit at bottom.</desc>

<defs>
  <style>
    .outer-ring { fill: #1a3a6e; }
    .field      { fill: #f5f0e0; }
    .inner-field { fill: #faf7ee; }
    .ring-txt   { fill: #f5f0e0; }
    .body-txt   { fill: #1a3a6e; }
    .motto-txt  { fill: #8b6914; }
    .amra-txt   { fill: #1a3a6e; }
    .helix-a    { stroke: #1a5a9e; }
    .helix-b    { stroke: #b8860b; }
    .ligand-c   { fill: #c0392b; }
    .prot-c     { fill: #1a7a5a; }
    .bond-l     { stroke: #6a8aaa; }
    .dna-backbone { stroke: #1a5a9e; }
    .base-pair  { stroke: #2a8a5a; }
  </style>
</defs>

<!-- OUTER RING (navy) -->
<circle cx="340" cy="390" r="310" class="outer-ring"/>
<!-- Cream field -->
<circle cx="340" cy="390" r="290" class="field"/>
<!-- Gold separator ring -->
<circle cx="340" cy="390" r="274" fill="none" stroke="#c8a84b" stroke-width="1.5"/>
<!-- Inner field -->
<circle cx="340" cy="390" r="270" class="inner-field"/>

<!-- CURVED TEXT TOP -->
<path id="topArc" d="M 60,390 A 280,280 0 0,1 620,390" fill="none"/>
<text font-family="Georgia,serif" font-size="13" letter-spacing="2" font-weight="600">
  <textPath href="#topArc" startOffset="50%" text-anchor="middle" class="ring-txt">
    AMRA · ANTI-MICROBIAL RESEARCH ASSOCIATION
  </textPath>
</text>

<!-- CURVED TEXT BOTTOM -->
<path id="botArc" d="M 72,418 A 280,280 0 0,0 608,418" fill="none"/>
<text font-family="Georgia,serif" font-size="13" letter-spacing="2" font-weight="600">
  <textPath href="#botArc" startOffset="50%" text-anchor="middle" class="ring-txt">
    ✦  THE UNIVERSITY OF BURDWAN  ✦
  </textPath>
</text>

<!-- UNIVERSITY CREST: lamp on open book -->
<g transform="translate(340,158)">
  <path d="M-38,12 Q-38,-8 -2,-10 L-2,22 Q-38,22 -38,12 Z" fill="#c8a84b" stroke="#8b6914" stroke-width="0.8"/>
  <path d="M38,12 Q38,-8 2,-10 L2,22 Q38,22 38,12 Z" fill="#c8a84b" stroke="#8b6914" stroke-width="0.8"/>
  <line x1="0" y1="-10" x2="0" y2="22" stroke="#8b6914" stroke-width="1.2"/>
  <line x1="-32" y1="-1" x2="-6" y2="-1" stroke="#8b6914" stroke-width="0.6" stroke-opacity="0.7"/>
  <line x1="-32" y1="4" x2="-6" y2="4" stroke="#8b6914" stroke-width="0.6" stroke-opacity="0.7"/>
  <line x1="-32" y1="9" x2="-6" y2="9" stroke="#8b6914" stroke-width="0.6" stroke-opacity="0.7"/>
  <line x1="6" y1="-1" x2="32" y2="-1" stroke="#8b6914" stroke-width="0.6" stroke-opacity="0.7"/>
  <line x1="6" y1="4" x2="32" y2="4" stroke="#8b6914" stroke-width="0.6" stroke-opacity="0.7"/>
  <line x1="6" y1="9" x2="32" y2="9" stroke="#8b6914" stroke-width="0.6" stroke-opacity="0.7"/>
  <!-- Lamp body -->
  <ellipse cx="0" cy="-16" rx="14" ry="6" fill="#c8a84b" stroke="#8b6914" stroke-width="0.8"/>
  <ellipse cx="0" cy="-18" rx="14" ry="4" fill="#daa520" stroke="#8b6914" stroke-width="0.8"/>
  <!-- Spout -->
  <path d="M10,-18 Q18,-20 20,-16 Q16,-14 10,-16 Z" fill="#c8a84b" stroke="#8b6914" stroke-width="0.6"/>
  <!-- Wick -->
  <line x1="17" y1="-17" x2="17" y2="-24" stroke="#555" stroke-width="1.2"/>
  <!-- Flame -->
  <ellipse cx="17" cy="-30" rx="3" ry="7" fill="#f5a623" fill-opacity="0.95"/>
  <ellipse cx="14" cy="-27" rx="2" ry="5" fill="#f5d020" fill-opacity="0.7"/>
  <ellipse cx="20" cy="-27" rx="2" ry="5" fill="#f5d020" fill-opacity="0.7"/>
  <ellipse cx="17" cy="-35" rx="1.5" ry="3" fill="#ffffffcc"/>
  <!-- Decorative dots -->
  <circle cx="-20" cy="-16" r="2.5" fill="#c8a84b" stroke="#8b6914" stroke-width="0.5"/>
  <circle cx="20" cy="-16" r="2.5" fill="#c8a84b" stroke="#8b6914" stroke-width="0.5"/>
</g>

<!-- MOTTO -->
<text x="340" y="206" text-anchor="middle" font-family="Georgia,serif" font-size="10.5" font-style="italic" class="motto-txt" letter-spacing="0.8">sā vidyā yā vimuktaye</text>
<line x1="240" y1="213" x2="440" y2="213" stroke="#c8a84b" stroke-width="0.8"/>

<!-- DNA DOUBLE HELIX (right side) -->
<path d="M430,245 C450,262 410,282 430,299 C450,316 410,336 430,353
          C450,370 410,390 430,407 C450,424 410,444 430,461
          C450,478 410,498 430,515"
      fill="none" class="dna-backbone" stroke-width="2.5" stroke-linecap="round"/>
<path d="M430,245 C410,262 450,282 430,299 C410,316 450,336 430,353
          C410,370 450,390 430,407 C410,424 450,444 430,461
          C410,478 450,498 430,515"
      fill="none" stroke="#c8a84b" stroke-width="2.5" stroke-linecap="round"/>
<g class="base-pair" stroke-width="1.5" stroke-linecap="round">
  <line x1="418" y1="262" x2="442" y2="262"/>
  <line x1="418" y1="299" x2="442" y2="299"/>
  <line x1="418" y1="336" x2="442" y2="336"/>
  <line x1="418" y1="373" x2="442" y2="373"/>
  <line x1="418" y1="410" x2="442" y2="410"/>
  <line x1="418" y1="447" x2="442" y2="447"/>
  <line x1="418" y1="484" x2="442" y2="484"/>
</g>
<g fill="#1a5a9e" fill-opacity="0.7">
  <circle cx="430" cy="262" r="3.5"/>
  <circle cx="430" cy="299" r="3.5"/>
  <circle cx="430" cy="336" r="3.5"/>
  <circle cx="430" cy="373" r="3.5"/>
  <circle cx="430" cy="410" r="3.5"/>
  <circle cx="430" cy="447" r="3.5"/>
  <circle cx="430" cy="484" r="3.5"/>
</g>
<g fill="#c8a84b" fill-opacity="0.7">
  <circle cx="430" cy="280" r="3"/>
  <circle cx="430" cy="317" r="3"/>
  <circle cx="430" cy="354" r="3"/>
  <circle cx="430" cy="391" r="3"/>
  <circle cx="430" cy="428" r="3"/>
  <circle cx="430" cy="465" r="3"/>
  <circle cx="430" cy="502" r="3"/>
</g>

<!-- PROTEIN α-HELIX (ribbon) -->
<g fill="none" stroke-width="9" stroke-linecap="round" class="helix-a" stroke-opacity="0.85">
  <path d="M280,250 C320,260 330,280 300,295"/>
  <path d="M300,295 C270,310 275,330 310,342"/>
  <path d="M310,342 C345,354 348,374 318,388"/>
  <path d="M318,388 C288,402 290,422 325,434"/>
  <path d="M325,434 C360,446 362,466 330,480"/>
  <path d="M330,480 C298,494 302,514 338,524"/>
</g>
<g fill="none" stroke-width="4" stroke-linecap="round" stroke="#1a3a6e" stroke-opacity="0.4">
  <path d="M280,250 C320,260 330,280 300,295"/>
  <path d="M310,342 C345,354 348,374 318,388"/>
  <path d="M325,434 C360,446 362,466 330,480"/>
</g>
<g fill="none" stroke-width="3" stroke-linecap="round" stroke="#88ccee" stroke-opacity="0.5">
  <path d="M300,295 C270,310 275,330 310,342"/>
  <path d="M318,388 C288,402 290,422 325,434"/>
  <path d="M330,480 C298,494 302,514 338,524"/>
</g>
<line x1="308" y1="248" x2="334" y2="526" stroke="#6a8aaa" stroke-width="0.8" stroke-dasharray="5,4" stroke-opacity="0.5"/>

<!-- LIGAND MOLECULE -->
<g transform="translate(378,368)">
  <polygon points="0,-14 13,-7 13,7 0,14 -13,7 -13,-7" fill="none" stroke="#c0392b" stroke-width="1.8"/>
  <polygon points="13,-7 28,-12 36,0 28,12 13,7" fill="none" stroke="#c0392b" stroke-width="1.8"/>
  <circle cx="0" cy="-14" r="4" class="ligand-c"/>
  <circle cx="13" cy="-7" r="4" fill="#2980b9"/>
  <circle cx="13" cy="7" r="4" class="ligand-c"/>
  <circle cx="0" cy="14" r="4" class="ligand-c"/>
  <circle cx="-13" cy="7" r="4" class="ligand-c"/>
  <circle cx="-13" cy="-7" r="4" fill="#2980b9"/>
  <circle cx="28" cy="-12" r="4" class="ligand-c"/>
  <circle cx="36" cy="0" r="4" fill="#f39c12"/>
  <circle cx="28" cy="12" r="4" class="ligand-c"/>
  <line x1="0" y1="-14" x2="0" y2="-24" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="0" cy="-28" r="3.5" fill="#27ae60"/>
  <line x1="36" y1="0" x2="46" y2="0" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="50" cy="0" r="3.5" fill="#c0392b"/>
</g>

<!-- INTERACTION BONDS -->
<g stroke-dasharray="5,3" stroke-width="1.2" stroke-opacity="0.7" class="bond-l" fill="none">
  <line x1="320" y1="370" x2="363" y2="368"/>
  <line x1="396" y1="368" x2="415" y2="368"/>
</g>
<text x="338" y="362" text-anchor="middle" font-family="monospace" font-size="9" class="body-txt" fill-opacity="0.6">H···O</text>
<text x="404" y="357" text-anchor="middle" font-family="monospace" font-size="9" class="body-txt" fill-opacity="0.6">π-stack</text>

<!-- AMRA ACRONYM -->
<line x1="230" y1="550" x2="450" y2="550" stroke="#c8a84b" stroke-width="0.8"/>
<text x="340" y="568" text-anchor="middle" font-family="Georgia,serif" font-size="46" font-weight="700" letter-spacing="10" class="amra-txt">AMRA</text>
<text x="340" y="592" text-anchor="middle" font-family="Georgia,serif" font-size="10" class="motto-txt" letter-spacing="2">EST. 2025</text>

<!-- LEGEND -->
<g font-family="Georgia,serif" font-size="9.5" class="body-txt" fill-opacity="0.75">
  <rect x="200" y="608" width="16" height="5" rx="2" fill="#1a5a9e" fill-opacity="0.8"/>
  <text x="220" y="614">α-helix</text>
  <rect x="268" y="608" width="16" height="5" rx="2" fill="#c8a84b" fill-opacity="0.8"/>
  <text x="288" y="614">DNA</text>
  <rect x="326" y="608" width="16" height="5" rx="2" fill="#c0392b" fill-opacity="0.8"/>
  <text x="346" y="614">ligand</text>
  <line x1="396" y1="611" x2="414" y2="611" stroke="#6a8aaa" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="418" y="614">interaction</text>
</g>

<!-- OUTER DECORATIVE BORDER -->
<circle cx="340" cy="390" r="310" fill="none" stroke="#c8a84b" stroke-width="2.5"/>
<circle cx="340" cy="390" r="305" fill="none" stroke="#c8a84b" stroke-width="0.5" stroke-opacity="0.4"/>

<!-- COMPASS ORNAMENTS -->
<circle cx="340" cy="82" r="5" fill="#c8a84b"/>
<circle cx="340" cy="698" r="5" fill="#c8a84b"/>
<circle cx="32"  cy="390" r="5" fill="#c8a84b"/>
<circle cx="648" cy="390" r="5" fill="#c8a84b"/>

</svg>
