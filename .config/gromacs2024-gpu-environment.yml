name: gromacs2024-gpu
channels:
  - conda-forge
  - bioconda
  - salilab
  - defaults

# Exported automatically into every shell on `conda activate gromacs2024-gpu`.
# Points pip's PEP 517 build-isolation resolver (and normal installs) at a
# setuptools<81 constraint, so pkg_resources stays available to legacy sdists
# (e.g. pandas==1.5.3, pinned by gmx_MMPBSA's setup.py) that still import it
# at build time. The file itself is written by post_install.sh.
variables:
  PIP_CONSTRAINT: $CONDA_PREFIX/etc/pip-build-constraints.txt

dependencies:
  # --- Core: anchor the solver first, same order as the def file ---
  - python=3.12
  - cudatoolkit=11.8
  - gromacs=2024.5=nompi_cuda_h5cb645a_0

  # --- Scientific / MD / analysis stack ---
  - numpy
  - scipy
  - pandas
  - rdkit
  - tqdm
  - mpi4py
  - scienceplots
  - ipympl
  - dssp=3.0.0 
  - libboost=1.73.0
  - ambertools
  - acpype
  - openbabel
  - mdanalysis
  - mdtraj
  - nglview=3.*
  - parmed
  - biopython
  - seaborn
  - plotly
  - jupyter
  - jupyterlab=4.5.*
  - jupyter_server>=2.14
  - nbconvert
  - jupyterlab-spellchecker
  - jupyterlab-git
  - jupyterlab-lsp
  - matplotlib-base
  - pdb2pqr
  - h5py
  - networkx>=3.4.2
  - setuptools<82
  - pip
  - tabulate
  - prody
  - alchemlyb
  - pymbar
  - pdbfixer
  - lipyphilic
  - py3dmol
  - numba
  - pmda
  - dask
  - dask-mpi
  - scikit-learn
  - simpletraj
  - dos2unix
  - git
  - wget

  # --- pip-only packages (not on conda-forge/bioconda) ---
  - pip:
      - amberutils
      - gromacs_py
      - importmonkey
      - ipyparallel
      - jupyterlab-execute-time
      - jupyterlab-code-formatter
      - biobb-common
      - biobb-chemistry
      - biobb-io
      - biobb-model
      - biobb-structure-checking
      - biobb-structure-utils
      - biobb-analysis
      - biobb-gromacs
      - insane
      - git+https://github.com/marrink-lab/vermouth-martinize.git#vermouth

# After `conda env create -f gromacs2024-gpu-environment.yml`, run:
#   conda activate gromacs2024-gpu
#   bash post_install.sh
# to install gmx_MMPBSA (--no-deps) and the CHARMM36 / Martini3 / cgenff /
# insane force-field and helper-script layer. See post_install.sh for details.
